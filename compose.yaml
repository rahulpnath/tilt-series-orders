name: shop-orders

services:
  orders-api:
    build:
      context: ${ORDERS_DIR:-.}
      dockerfile: orders-api.dev.Dockerfile
    environment:
      ConnectionStrings__Db: "Server=sqlserver,1433;Database=ShopOrders;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Rabbit__Url: "amqp://shop:shop@rabbitmq"
      Catalog__Url: "http://catalog-api:5101"
    volumes:
      - ${ORDERS_DIR:-.}/src:/src
    networks:
      default:
      shopnet:
        aliases:
          - orders-api

  orders-worker:
    build:
      context: ${ORDERS_DIR:-.}
      dockerfile: orders-worker.dev.Dockerfile
    environment:
      Rabbit__Url: "amqp://shop:shop@rabbitmq"
    volumes:
      - ${ORDERS_DIR:-.}/src:/src

# Caddy's network; it reaches the API by its alias.
networks:
  shopnet:
    external: true
