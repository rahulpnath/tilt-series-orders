# Orders: its own repo, its own compose file, its own project — and no shared
# network, so nothing here can reach catalog-api by name.

name: shop-orders

services:
  orders-api:
    build:
      context: ..
      dockerfile: docker/orders-api.dev.Dockerfile
    image: shop-orders-api:dev
    ports:
      # Published because the Storefront calls it from the browser, on your machine.
      - "5102:5102"
    environment:
      ConnectionStrings__Db: "Server=sqlserver,1433;Database=ShopOrders;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Rabbit__Url: "amqp://shop:shop@rabbitmq"
    volumes:
      - ../src:/src
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  orders-worker:
    build:
      context: ..
      dockerfile: docker/orders-worker.dev.Dockerfile
    image: shop-orders-worker:dev
    environment:
      Rabbit__Url: "amqp://shop:shop@rabbitmq"
    volumes:
      - ../src:/src
    depends_on:
      rabbitmq:
        condition: service_started

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      # sqlcmd is not on PATH and lives in /opt/mssql-tools18/bin here; 18 encrypts
      # by default, so -C trusts the self-signed cert.
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: shop
      RABBITMQ_DEFAULT_PASS: shop
    # No management UI: Catalog's compose already binds 15672 on your machine.

volumes:
  sql-data:
